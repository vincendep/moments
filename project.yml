name: Moments
options:
  bundleIdPrefix: it.vincendep
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
targets:
  Moments:
    type: application
    platform: iOS
    sources: [Moments]
    # iCloud (CloudKit) sync of the SwiftData store. Needs a paid team: set DEVELOPMENT_TEAM below
    # and a bundle ID you own; the container is derived from it.
    entitlements:
      path: Moments/Moments.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)]
        aps-environment: development
    info:
      path: Moments/Info.plist
      properties:
        # CloudKit pushes changes from other devices in the background.
        UIBackgroundModes: [remote-notification]
        # Bundled fonts (Moments/Fonts, SIL Open Font License); see AlbumFont in Views/Theme.swift.
        UIAppFonts: [Fraunces.ttf, Fraunces-Italic.ttf, Caveat.ttf, VT323-Regular.ttf]
        # Launch screen: the thread from the icon, centred on album paper (both follow dark mode).
        UILaunchScreen:
          UIColorName: Paper
          UIImageName: LaunchMark
    settings:
      base:
        # DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: it.vincendep.moments
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The milestones thread; regenerate the PNGs with `swift scripts/render-icon.swift`.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "Capture photos and videos for your timelines."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record voice memos and video sound."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Show your moments stored in Photos."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save new moments to Photos."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Add where a moment happened to its entry."
